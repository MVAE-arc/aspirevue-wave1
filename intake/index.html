<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AspireVue · Intake</title>
<meta http-equiv="refresh" content="0; url=https://tally.so/r/aQKAL9">
<link rel="canonical" href="https://tally.so/r/aQKAL9">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('arckin_theme');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', stored || (systemDark ? 'dark' : 'light'));
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --max-w: 720px;
  }
  [data-theme="dark"] {
    --bg-canvas: #1c1c1c;
    --fg-primary: #B0BEC5;
    --fg-muted:   rgba(176, 190, 197, 0.55);
    --accent-ember: #FFAB40;
    --hairline:   #263238;
  }
  [data-theme="light"] {
    --bg-canvas: #F4F1EC;
    --fg-primary: #263238;
    --fg-muted:   rgba(38, 50, 56, 0.55);
    --accent-ember: #B8590A;
    --hairline:   rgba(38, 50, 56, 0.22);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-canvas);
    color: var(--fg-primary);
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background-color 320ms var(--ease-out), color 320ms var(--ease-out);
  }
  .card {
    max-width: var(--max-w);
    width: 100%;
    text-align: left;
    border: 1px solid var(--hairline);
    padding: 40px 36px;
  }
  .brand {
    font-family: 'Syne', 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 32px;
  }
  .brand-divider { color: var(--accent-ember); opacity: 0.7; margin: 0 8px; }
  .brand-product { color: var(--fg-primary); opacity: 0.9; }
  h1 {
    font-family: 'Syne', 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 em {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400;
    font-style: italic;
    color: var(--accent-ember);
    text-transform: none;
    display: block;
    margin-top: 6px;
    font-size: clamp(20px, 2.8vw, 28px);
  }
  p {
    margin-top: 16px;
    line-height: 1.7;
  }
  a.cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    font-family: 'JetBrains Mono', 'Menlo', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-primary);
    background: transparent;
    border: 1px solid var(--accent-ember);
    padding: 14px 22px;
    text-decoration: none;
    transition: background-color 220ms var(--ease-out), color 220ms var(--ease-out);
  }
  a.cta:hover { background: var(--accent-ember); color: var(--bg-canvas); }
  .meta {
    margin-top: 32px;
    font-family: 'JetBrains Mono', 'Menlo', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      Arc'kin
      <span class="brand-divider">—</span>
      <span class="brand-product">AspireVue</span>
      <span class="brand-divider">—</span>
      Intake
    </div>
    <h1>
      Intake.
      <em>Opening your form…</em>
    </h1>
    <p>If you are not redirected automatically, use the link below.</p>
    <a class="cta" href="https://tally.so/r/aQKAL9">
      <span>Continue to intake</span>
      <span aria-hidden="true">→</span>
    </a>
    <div class="meta">Form hosted at tally.so</div>
  </main>
  <script>
    window.location.replace('https://tally.so/r/aQKAL9');
  </script>
</body>
</html>
